add_newline = false
format = "$username:$directory$git_branch$git_status$python$character"

[character]
success_symbol = ">"
error_symbol = ">"

[directory]
format = "[$path]($style)"
style = "bold yellow"
truncation_length = 3

[git_branch]
format = " on [$branch]($style)"
style = "bold purple"

[git_status]
format = " [$all_status$ahead_behind]($style)"
style = "bold red"

[python]
format = " [py $version]($style)"
style = "bold green"

[username]
format = "[$user]($style)"
show_always = true
style_user = "bold cyan"
